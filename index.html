/* ---------- STORAGE ---------- */
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadData(){
  try{
    const { data, error } = await db.from("alumnos").select("*").order("nombre");
    if(error) throw error;
    students = (data||[]).map(r => ({ id: r.id, nombre: r.nombre, fecha_ingreso: r.fecha_ingreso, pin: r.pin || "" }));
  }catch(e){ console.error(e); students = []; toast("No se pudo conectar con Supabase"); }
  try{
    const { data, error } = await db.from("ejercicios").select("*").order("nombre");
    if(error) throw error;
    exercises = { superior: [], inferior: [] };
    (data||[]).forEach(r => { if(exercises[r.categoria]) exercises[r.categoria].push(r.nombre); });
  }catch(e){ console.error(e); exercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES)); }
  render();
}

// Reemplaza TODA la fila del alumno que cambió (agregar / editar PIN).
// No borra alumnos que ya no están en el array local: eso lo hace
// directamente el botón "Eliminar alumno".
async function saveStudents(){
  if(!students.length) return;
  const rows = students.map(s => ({ id: s.id, nombre: s.nombre, fecha_ingreso: s.fecha_ingreso, pin: s.pin || null }));
  const { error } = await db.from("alumnos").upsert(rows);
  if(error){ console.error(error); toast("Error al guardar alumno"); }
}

async function saveExercises(){
  const rows = [
    ...exercises.superior.map(nombre => ({ nombre, categoria: "superior" })),
    ...exercises.inferior.map(nombre => ({ nombre, categoria: "inferior" }))
  ];
  const { error } = await db.from("ejercicios").upsert(rows, { onConflict: "nombre" });
  if(error){ console.error(error); toast("Error al guardar ejercicio"); }
}

    if(error) throw error;
    return (data||[]).map(r => ({ id: r.id, fecha: r.fecha, categoria: r.categoria, ejercicio: r.ejercicio, peso: Number(r.peso), reps: Number(r.reps) }));
  }catch(e){ console.error(e); return []; }

// Sobrescribe TODO el historial del alumno con el array que le pasás:
// borra sus filas en "registros" y vuelve a insertar arr entero.
// Así el resto de la app (que arma el array completo y llama
// saveLogs) no necesita saber nada de SQL.
async function saveLogs(studentId, arr){
  const { error: delErr } = await db.from("registros").delete().eq("alumno_id", studentId);
  if(delErr){ console.error(delErr); toast("Error al guardar el registro"); return; }
  if(!arr.length) return;
  const rows = arr.map(l => ({ id: l.id, alumno_id: studentId, fecha: l.fecha, categoria: l.categoria || null, ejercicio: l.ejercicio, peso: l.peso, reps: l.reps }));
  const { error } = await db.from("registros").insert(rows);
  if(error){ console.error(error); toast("Error al guardar el registro"); }
}

async function loadMaxs(studentId){
  try{
    const { data, error } = await db.from("maximos").select("*").eq("alumno_id", studentId);
    if(error) throw error;
    const obj = {};
    (data||[]).forEach(r => obj[r.ejercicio] = Number(r.peso));
    return obj;
  }catch(e){ console.error(e); return {}; }
}
async function saveMaxs(studentId, obj){
  const { error: delErr } = await db.from("maximos").delete().eq("alumno_id", studentId);
  if(delErr){ console.error(delErr); toast("Error al guardar los récords"); return; }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){
  return (s||"").toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d){
  const [y,m,day] = d.split("-");
  return day+"/"+m+"/"+y;
}
function fmtDateShort(d){
  const [y,m,day] = d.split("-");
  return day+"/"+m;
}

/* ---------- CHART ---------- */
function progressChartSVG(points){
  if(points.length < 2){
    return '<div class="empty">Necesitás al menos 2 registros de este ejercicio para ver el progreso.</div>';
  }
  const W = 640, H = 220, padL = 36, padR = 16, padT = 16, padB = 30;
  const weights = points.map(p=>p.peso);
  let min = Math.min(...weights), max = Math.max(...weights);
  if(min === max){ min -= 5; max += 5; }
  const margin = (max-min) * 0.15;
  min -= margin; max += margin;
  if(min < 0) min = 0;

  const x = i => padL + (i/(points.length-1)) * (W - padL - padR);
  const y = v => H - padB - ((v-min)/(max-min)) * (H - padT - padB);

  const linePoints = points.map((p,i)=> x(i)+","+y(p.peso)).join(" ");
  const dots = points.map((p,i)=> '<circle cx="'+x(i)+'" cy="'+y(p.peso)+'" r="4" fill="#c8ff4d"/>').join("");
  const labels = points.map((p,i)=> {
    if(points.length > 8 && i % Math.ceil(points.length/8) !== 0 && i !== points.length-1) return "";
    return '<text x="'+x(i)+'" y="'+(H-8)+'" font-size="10" fill="#8b949b" text-anchor="middle">'+fmtDateShort(p.fecha)+'</text>';
  }).join("");
  const valueLabels = points.map((p,i)=> '<text x="'+x(i)+'" y="'+(y(p.peso)-10)+'" font-size="10" fill="#f2f4f1" text-anchor="middle">'+p.peso+'</text>').join("");

  return '<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+W+'px;">'
    + '<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'" stroke="#333d46" stroke-width="1"/>'
    + '<polyline points="'+linePoints+'" fill="none" stroke="#c8ff4d" stroke-width="2.5"/>'
    + dots + valueLabels + labels + '</svg></div>';
}

/* ---------- EXPORTS ---------- */
function exportExcel(st, sortedLogs){
  if(!sortedLogs.length){ toast("No hay registros para exportar"); return; }
  const rows = sortedLogs.map(l => ({
    Fecha: fmtDate(l.fecha),
    Ejercicio: l.ejercicio,
    "Peso (kg)": l.peso,
    Repeticiones: l.reps
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:12},{wch:32},{wch:12},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Historial");
  XLSX.writeFile(wb, st.nombre.replace(/\s+/g,'_') + "_historial.xlsx");
}

function exportPDF(st, sortedLogs){
  if(!sortedLogs.length){ toast("No hay registros para exportar"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(16);
  doc.text("KarFit - Historial de " + st.nombre, 14, 18);
  doc.setFontSize(10);
  doc.setTextColor(120);
  doc.text("Fecha de ingreso: " + fmtDate(st.fecha_ingreso), 14, 25);
  doc.autoTable({
    startY: 32,
    head: [["Fecha","Ejercicio","Peso (kg)","Repeticiones"]],
    body: sortedLogs.map(l => [fmtDate(l.fecha), l.ejercicio, String(l.peso), String(l.reps)]),
    headStyles: { fillColor: [30,35,41] },
    styles: { fontSize: 9 }
  });
  doc.save(st.nombre.replace(/\s+/g,'_') + "_historial.pdf");
}

    + (rows.length ? rows.map(s => ''
        + '<div class="student-row" data-id="'+s.id+'">'
        + '<div><div class="name">'+escapeHtml(s.nombre)+'</div><div class="meta">Ingresó '+fmtDate(s.fecha_ingreso)+'</div></div>'
        + '<div class="meta">Ver ficha &rarr;</div>'
        + '</div>'
      ).join("") : '<div class="empty">Todavía no cargaste alumnos.</div>')
    + '</div>';
  document.getElementById("back").onclick = ()=>{ state = {view:"role"}; render(); };
  document.getElementById("manage-ex").onclick = ()=>{ state.view="trainer-exercises"; render(); };
  document.getElementById("add-student").onclick = ()=>{
    const c = document.getElementById("add-card");
    c.style.display = c.style.display === "none" ? "block" : "none";
  };
  document.getElementById("save-student").onclick = async ()=>{
    const nombre = document.getElementById("new-name").value.trim();
    const fecha = document.getElementById("new-date").value;
    let pin = document.getElementById("new-pin").value.trim();
    if(!nombre || !fecha){ toast("Completá nombre y fecha"); return; }
    if(pin && !/^\d{4}$/.test(pin)){ toast("El PIN debe tener 4 números"); return; }
    if(!pin) pin = randomPin();
    students.push({id: uid(), nombre, fecha_ingreso: fecha, pin});
    await saveStudents();
    toast("Alumno agregado · PIN: " + pin);
    render();
  };
  app.querySelectorAll(".student-row").forEach(el=>{
    el.onclick = ()=>{ state = {view:"trainer-detail", studentId: el.dataset.id}; render(); };
  });
}

/* ---------- TRAINER: MANAGE EXERCISES ---------- */
function renderTrainerExercises(){
  app.innerHTML = ''
    + '<span class="back" id="back">&larr; Volver a alumnos</span>'
    + '<div class="top"><div><div class="tag">ENTRENADORA</div><h1>Ejercicios</h1></div></div>'
    + '<div class="card"><h3 class="section-title">Agregar ejercicio nuevo</h3>'
    + '<div class="row">'
    + '<div class="field"><label>Nombre del ejercicio</label><input id="new-ex-name" placeholder="Ej: Sentadilla Hack"></div>'
    + '<div class="field"><label>Categoría</label><select id="new-ex-cat"><option value="superior">Miembros Superiores</option><option value="inferior">Miembros Inferiores</option></select></div>'
    + '</div><button class="btn" id="save-ex">Agregar ejercicio</button></div>'
    + '<div class="card"><h3 class="section-title">Miembros Superiores ('+exercises.superior.length+')</h3>'
    + exercises.superior.map(e=>'<div class="exercise-list-item">'+escapeHtml(e)+'</div>').join("") + '</div>'
    + '<div class="card"><h3 class="section-title">Miembros Inferiores ('+exercises.inferior.length+')</h3>'
    + exercises.inferior.map(e=>'<div class="exercise-list-item">'+escapeHtml(e)+'</div>').join("") + '</div>';
  document.getElementById("back").onclick = ()=>{ state.view="trainer-list"; render(); };
  document.getElementById("save-ex").onclick = async ()=>{
    const name = document.getElementById("new-ex-name").value.trim();
    const cat = document.getElementById("new-ex-cat").value;
    if(!name){ toast("Escribí un nombre de ejercicio"); return; }
    if(exercises[cat].some(e=>e.toLowerCase()===name.toLowerCase())){ toast("Ese ejercicio ya existe"); return; }
    exercises[cat].push(name);
    await saveExercises();
    toast("Ejercicio agregado");
    render();
  };
}

/* ---------- TRAINER: STUDENT DETAIL ---------- */
async function renderTrainerDetail(){
  const st = students.find(s=>s.id===state.studentId);
  app.innerHTML = '<div class="loading">Cargando ficha…</div>';
  const [data, maxs, comments] = await Promise.all([
    loadLogs(st.id), loadMaxs(st.id), loadComments(st.id)
  ]);
  const sorted = data.slice().sort((a,b)=> b.fecha.localeCompare(a.fecha));
  const allExercises = exercises.superior.concat(exercises.inferior);
  const exercisesWithData = Array.from(new Set(data.map(l=>l.ejercicio)));
  if(!state.chartExercise && exercisesWithData.length) state.chartExercise = exercisesWithData[0];

  const chartPoints = state.chartExercise
    ? data.filter(l=>l.ejercicio===state.chartExercise).sort((a,b)=>a.fecha.localeCompare(b.fecha))
    : [];

  const editingId = state.editingLogId;

  const historyRows = sorted.map(l=>{
    const isMax = maxs[l.ejercicio] !== undefined && Number(maxs[l.ejercicio]) === Number(l.peso);
    if(editingId === l.id){
      return '<tr data-log-id="'+l.id+'">'
        + '<td><input class="edit-input" style="width:118px;" type="date" id="edit-fecha" value="'+l.fecha+'"></td>'
        + '<td><select id="edit-ejercicio">' + allExercises.map(ex=>'<option value="'+escapeHtml(ex)+'" '+(ex===l.ejercicio?'selected':'')+'>'+escapeHtml(ex)+'</option>').join("") + '</select></td>'
        + '<td><input class="edit-input" type="number" step="0.5" id="edit-peso" value="'+l.peso+'"></td>'
        + '<td><input class="edit-input" type="number" step="1" id="edit-reps" value="'+l.reps+'"></td>'
        + '<td><div class="row-actions"><button class="icon-btn" id="edit-save">Guardar</button><button class="icon-btn" id="edit-cancel">Cancelar</button></div></td>'
        + '</tr>';
    }
    return '<tr data-log-id="'+l.id+'">'
      + '<td>'+fmtDate(l.fecha)+'</td>'
      + '<td>'+escapeHtml(l.ejercicio)+'</td>'
      + '<td>'+l.peso+' kg '+(isMax ? '<span class="pr">MÁX</span>' : '')+'</td>'
      + '<td>'+l.reps+'</td>'
      + '<td><div class="row-actions"><button class="icon-btn edit-log" data-id="'+l.id+'">Editar</button><button class="icon-btn del del-log" data-id="'+l.id+'">Borrar</button></div></td>'
      + '</tr>';
  }).join("");

  app.innerHTML = ''
    + '<span class="back" id="back">&larr; Volver a alumnos</span>'
    + '<div class="top"><div><div class="tag">FICHA DE ALUMNO</div><h1>'+escapeHtml(st.nombre)+'</h1></div>'
    + '<button class="btn ghost small" id="del-student">Eliminar alumno</button></div>'
    + '<div class="card">'
    + '<div class="meta" style="margin-bottom:10px;">Fecha de ingreso: '+fmtDate(st.fecha_ingreso)+' · '+data.length+' registros cargados</div>'
    + '<div class="row" style="align-items:center;">'
    + '<div class="field" style="max-width:160px;"><label>PIN de acceso</label><input id="edit-pin" maxlength="4" value="'+(st.pin||'')+'"></div>'
    + '<div class="field" style="flex:0;align-self:flex-end;"><button class="btn ghost small" id="save-pin">Actualizar PIN</button></div>'
    + '</div>'
    + '</div>'
    + '<div class="card"><h3 class="section-title">Récords / máximos</h3>'
    + allExercises.map(ex=>''
        + '<div class="exercise-list-item"><span>'+escapeHtml(ex)+'</span>'
        + '<span><input class="max-input" type="number" step="0.5" min="0" data-ex="'+escapeHtml(ex)+'" value="'+(maxs[ex] !== undefined ? maxs[ex] : '')+'" placeholder="kg"></span></div>'
      ).join("")
    + '<button class="btn" id="save-maxs" style="margin-top:14px;">Guardar récords</button></div>'
    + '<div class="card"><h3 class="section-title">Comentarios (solo los ve '+escapeHtml(st.nombre.split(' ')[0])+')</h3>'
    + '<div class="field"><textarea id="new-comment" placeholder="Escribí una nota o indicación para este alumno..."></textarea></div>'
    + '<button class="btn" id="save-comment">Agregar comentario</button>'
    + (comments.length ? '<div style="margin-top:16px;">' + comments.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(c=>''
        + '<div class="comment-item"><div class="comment-date">'+fmtDate(c.fecha)+'</div><div class="comment-text">'+escapeHtml(c.texto)+'</div></div>'
      ).join("") + '</div>' : '')
    + '</div>'
    + '<div class="card"><h3 class="section-title">Progreso por ejercicio</h3>'
    + (exercisesWithData.length ? ''
        + '<div class="field"><select id="chart-ex-select">' + exercisesWithData.map(ex=>'<option value="'+escapeHtml(ex)+'" '+(ex===state.chartExercise?'selected':'')+'>'+escapeHtml(ex)+'</option>').join("") + '</select></div>'
        + progressChartSVG(chartPoints)
      : '<div class="empty">Este alumno todavía no tiene ejercicios cargados.</div>')
    + '</div>'
    + '<div class="card">'
    + '<div class="section-header"><h3 class="section-title">Historial de entrenamientos</h3>'
    + (sorted.length ? '<div style="display:flex;gap:8px;"><button class="btn ghost small" id="exp-pdf">Exportar PDF</button><button class="btn ghost small" id="exp-xlsx">Exportar Excel</button></div>' : '')
    + '</div>'
    + (sorted.length ? '<table><tr><th>Fecha</th><th>Ejercicio</th><th>Peso</th><th>Reps</th><th></th></tr>' + historyRows + '</table>'
        : '<div class="empty">Este alumno todavía no cargó entrenamientos.</div>')
    + '</div>';

  document.getElementById("back").onclick = ()=>{ state = {view:"trainer-list"}; render(); };
  document.getElementById("del-student").onclick = async ()=>{
    if(!confirm("¿Eliminar a " + st.nombre + " y todo su historial? Esta acción no se puede deshacer.")) return;
    const { error } = await db.from("alumnos").delete().eq("id", st.id);
    if(error){ console.error(error); toast("Error al eliminar el alumno"); return; }
    students = students.filter(s=>s.id!==st.id);
    state = {view:"trainer-list"};
    render();
  };
  document.getElementById("save-pin").onclick = async ()=>{
    const pin = document.getElementById("edit-pin").value.trim();
    if(pin && !/^\d{4}$/.test(pin)){ toast("El PIN debe tener 4 números"); return; }
    st.pin = pin;
    await saveStudents();
    toast("PIN actualizado");
  };
  document.getElementById("save-maxs").onclick = async ()=>{
    const inputs = document.querySelectorAll(".max-input");
    const newMaxs = {};
    inputs.forEach(inp=>{
      const v = inp.value.trim();
      if(v !== "") newMaxs[inp.dataset.ex] = parseFloat(v);
    });
    await saveMaxs(st.id, newMaxs);
    toast("Récords guardados");
    renderTrainerDetail();
  };
  document.getElementById("save-comment").onclick = async ()=>{
    const texto = document.getElementById("new-comment").value.trim();
    if(!texto){ toast("Escribí un comentario"); return; }
    const current = await loadComments(st.id);
    current.push({id: uid(), fecha: new Date().toISOString().slice(0,10), texto});
    await saveComments(st.id, current);
    toast("Comentario agregado");
    renderTrainerDetail();
  };
  const chartSel = document.getElementById("chart-ex-select");
  if(chartSel){ chartSel.onchange = (e)=>{ state.chartExercise = e.target.value; renderTrainerDetail(); }; }

  const expPdf = document.getElementById("exp-pdf");
  if(expPdf){ expPdf.onclick = ()=> exportPDF(st, sorted); }
  const expXlsx = document.getElementById("exp-xlsx");
  if(expXlsx){ expXlsx.onclick = ()=> exportExcel(st, sorted); }

  app.querySelectorAll(".edit-log").forEach(btn=>{
    btn.onclick = ()=>{ state.editingLogId = btn.dataset.id; renderTrainerDetail(); };
  });
  app.querySelectorAll(".del-log").forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm("¿Borrar este registro?")) return;
      const updated = data.filter(l=>l.id !== btn.dataset.id);
      await saveLogs(st.id, updated);
      toast("Registro borrado");
      renderTrainerDetail();
    };
  });
  const editSave = document.getElementById("edit-save");
  if(editSave){
    editSave.onclick = async ()=>{
      const fecha = document.getElementById("edit-fecha").value;
      const ejercicio = document.getElementById("edit-ejercicio").value;
      const peso = parseFloat(document.getElementById("edit-peso").value);
      const reps = parseInt(document.getElementById("edit-reps").value);
      if(!fecha || !ejercicio || isNaN(peso) || isNaN(reps)){ toast("Completá todos los campos"); return; }
      const updated = data.map(l => l.id === editingId ? Object.assign({}, l, {fecha, ejercicio, peso, reps}) : l);
      await saveLogs(st.id, updated);
      state.editingLogId = null;
      toast("Registro actualizado");
      renderTrainerDetail();
    };
  }
  const editCancel = document.getElementById("edit-cancel");
  if(editCancel){ editCancel.onclick = ()=>{ state.editingLogId = null; renderTrainerDetail(); }; }
}

/* ---------- STUDENT: SELECT ---------- */
function renderStudentSelect(){
  const rows = students.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  app.innerHTML = ''
    + '<span class="back" id="back">&larr; Volver</span>'
    + '<div class="top"><div><div class="tag">ALUMNO</div><h1>¿Quién sos?</h1></div></div>'
    + '<div class="card"><div class="field"><label>Elegí tu nombre</label>'
    + '<select id="student-picker"><option value="">Seleccionar...</option>'
    + rows.map(s=>'<option value="'+s.id+'">'+escapeHtml(s.nombre)+'</option>').join("")
    + '</select></div>'
    + (rows.length === 0 ? '<div class="meta">Tu entrenadora todavía no te agregó a la lista.</div>' : '')
    + '</div>';
  document.getElementById("back").onclick = ()=>{ state = {view:"role"}; render(); };
  document.getElementById("student-picker").onchange = (e)=>{
    if(!e.target.value) return;
    const st = students.find(s=>s.id===e.target.value);
    if(st.pin){
      state = { view: "student-pin", studentId: st.id };
    } else {
      state = {
        view: "student-home", studentId: st.id,
        sessionDate: new Date().toISOString().slice(0,10),
        category: null, chartExercise: null
      };
    }
    render();
  };
}

/* ---------- STUDENT: PIN ---------- */
function renderStudentPin(){
  const st = students.find(s=>s.id===state.studentId);
  app.innerHTML = ''
    + '<span class="back" id="back">&larr; Volver</span>'
    + '<div class="top"><div><div class="tag">ALUMNO</div><h1>Hola, '+escapeHtml(st.nombre.split(' ')[0])+'</h1></div></div>'
    + '<div class="card pin-box">'
    + '<div class="field"><label>Ingresá tu PIN de 4 dígitos</label><input id="pin-input" maxlength="4" inputmode="numeric" placeholder="••••"></div>'
    + '<button class="btn wide" id="pin-submit">Ingresar</button>'
    + '<div class="meta" style="margin-top:10px;">¿No lo sabés? Pedíselo a tu entrenadora.</div>'
    + '</div>';
  document.getElementById("back").onclick = ()=>{ state = {view:"student-select"}; render(); };
  const submit = ()=>{
    const val = document.getElementById("pin-input").value.trim();
    if(val === st.pin){
      state = {
        view: "student-home", studentId: st.id,
        sessionDate: new Date().toISOString().slice(0,10),
        category: null, chartExercise: null
      };
      render();
    } else {
      toast("PIN incorrecto");
    }
  };
  document.getElementById("pin-submit").onclick = submit;
  document.getElementById("pin-input").addEventListener("keydown", (e)=>{ if(e.key==="Enter") submit(); });
}

/* ---------- STUDENT: HOME ---------- */
async function renderStudentHome(){
  const st = students.find(s=>s.id===state.studentId);
  app.innerHTML = '<div class="loading">Cargando tu ficha…</div>';
  const [data, comments] = await Promise.all([loadLogs(st.id), loadComments(st.id)]);
  const sorted = data.slice().sort((a,b)=> b.fecha.localeCompare(a.fecha));
  const todaysEntries = data.filter(l=>l.fecha === state.sessionDate);
  const exercisesWithData = Array.from(new Set(data.map(l=>l.ejercicio)));
  if(!state.chartExercise && exercisesWithData.length) state.chartExercise = exercisesWithData[0];
  const chartPoints = state.chartExercise
    ? data.filter(l=>l.ejercicio===state.chartExercise).sort((a,b)=>a.fecha.localeCompare(b.fecha))
    : [];

  const categoryExercises = state.category === "superior" ? exercises.superior
    : state.category === "inferior" ? exercises.inferior : [];

  app.innerHTML = ''
    + '<span class="back" id="back">&larr; Cambiar de alumno</span>'
    + '<div class="top"><div><div class="tag">MI FICHA</div><h1>'+escapeHtml(st.nombre)+'</h1></div></div>'
    + (comments.length ? '<div class="card"><h3 class="section-title">Notas de tu entrenadora</h3>'
        + comments.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,5).map(c=>''
            + '<div class="comment-item"><div class="comment-date">'+fmtDate(c.fecha)+'</div><div class="comment-text">'+escapeHtml(c.texto)+'</div></div>'
          ).join("") + '</div>' : '')
    + '<div class="card"><h3 class="section-title">Cargar entrenamiento</h3>'
    + '<div class="field"><label>Fecha del entrenamiento</label><input id="session-date" type="date" value="'+state.sessionDate+'"></div>'
    + '<div class="field"><label>Elegí grupo muscular</label><div class="cat-pick">'
    + '<div class="cat-card '+(state.category==='superior'?'active':'')+'" id="cat-superior">Miembros Superiores</div>'
    + '<div class="cat-card '+(state.category==='inferior'?'active':'')+'" id="cat-inferior">Miembros Inferiores</div>'
    + '</div></div>'
    + (state.category ? ''
        + '<div class="row" style="margin-top:16px;">'
        + '<div class="field"><label>Ejercicio</label><select id="log-exercise">' + categoryExercises.map(e=>'<option value="'+escapeHtml(e)+'">'+escapeHtml(e)+'</option>').join("") + '</select></div>'
        + '<div class="field"><label>Peso (kg)</label><input id="log-weight" type="number" min="0" step="0.5" placeholder="Ej: 40"></div>'
        + '<div class="field"><label>Repeticiones</label><input id="log-reps" type="number" min="1" step="1" placeholder="Ej: 10"></div>'
        + '</div><button class="btn" id="save-log">Guardar ejercicio</button>'
      : '')
    + (todaysEntries.length ? '<div style="margin-top:18px;"><div class="meta" style="margin-bottom:6px;">Cargado hoy ('+fmtDate(state.sessionDate)+'):</div>'
        + todaysEntries.map(l=>'<div class="today-item"><span>'+escapeHtml(l.ejercicio)+'</span><span class="pill">'+l.peso+' kg × '+l.reps+'</span></div>').join("")
        + '</div>' : '')
    + '</div>'
    + '<div class="card"><h3 class="section-title">Mi progreso</h3>'
    + (exercisesWithData.length ? ''
        + '<div class="field"><select id="chart-ex-select">' + exercisesWithData.map(ex=>'<option value="'+escapeHtml(ex)+'" '+(ex===state.chartExercise?'selected':'')+'>'+escapeHtml(ex)+'</option>').join("") + '</select></div>'
        + progressChartSVG(chartPoints)
      : '<div class="empty">Todavía no tenés ejercicios cargados.</div>')
    + '</div>'
    + '<div class="card"><div class="section-header"><h3 class="section-title">Mi historial completo</h3>'
    + (sorted.length ? '<div style="display:flex;gap:8px;"><button class="btn ghost small" id="exp-pdf">Exportar PDF</button><button class="btn ghost small" id="exp-xlsx">Exportar Excel</button></div>' : '')
    + '</div>'
    + (sorted.length ? '<table><tr><th>Fecha</th><th>Ejercicio</th><th>Peso</th><th>Reps</th></tr>'
        + sorted.map(l=>'<tr><td>'+fmtDate(l.fecha)+'</td><td>'+escapeHtml(l.ejercicio)+'</td><td>'+l.peso+' kg</td><td>'+l.reps+'</td></tr>').join("")
        + '</table>' : '<div class="empty">Todavía no cargaste ningún entrenamiento.</div>')
    + '</div>';

  document.getElementById("back").onclick = ()=>{ state = {view:"student-select"}; render(); };
  document.getElementById("session-date").onchange = (e)=>{ state.sessionDate = e.target.value; render(); };
  document.getElementById("cat-superior").onclick = ()=>{ state.category = "superior"; render(); };
  document.getElementById("cat-inferior").onclick = ()=>{ state.category = "inferior"; render(); };

  const saveBtn = document.getElementById("save-log");
  if(saveBtn){
    saveBtn.onclick = async ()=>{
      const ejercicio = document.getElementById("log-exercise").value;
      const peso = parseFloat(document.getElementById("log-weight").value);
      const reps = parseInt(document.getElementById("log-reps").value);
      if(!ejercicio || isNaN(peso) || isNaN(reps)){ toast("Completá peso y repeticiones"); return; }
      const current = await loadLogs(st.id);
      current.push({id: uid(), fecha: state.sessionDate, categoria: state.category, ejercicio, peso, reps});
      await saveLogs(st.id, current);
      toast("Ejercicio guardado ✓");
      render();
    };
  }
  const chartSel = document.getElementById("chart-ex-select");
  if(chartSel){ chartSel.onchange = (e)=>{ state.chartExercise = e.target.value; render(); }; }

  const expPdf = document.getElementById("exp-pdf");
  if(expPdf){ expPdf.onclick = ()=> exportPDF(st, sorted); }
  const expXlsx = document.getElementById("exp-xlsx");
  if(expXlsx){ expXlsx.onclick = ()=> exportExcel(st, sorted); }
}

loadData();
</script>
